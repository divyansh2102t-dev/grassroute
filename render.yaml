# Render Blueprint specification for GrassRoute
# https://render.com/docs/blueprint-spec

services:
  # 1. Static Site (Free, global CDN, instant deployment)
  - type: web
    name: grassroute
    runtime: static
    buildCommand: "" # No build step needed, vanilla web app
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp

  # 2. Web Service (Node.js runtime alternative for containerized or custom server hosting)
  - type: web
    name: grassroute-node
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
